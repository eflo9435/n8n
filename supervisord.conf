[supervisord]
nodaemon=true
user=root

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:n8n]
command=n8n start
environment=N8N_HOST=%(ENV_N8N_HOST)s,N8N_PORT=5678,N8N_PROTOCOL=%(ENV_N8N_PROTOCOL)s,WEBHOOK_URL=%(ENV_WEBHOOK_URL)s,N8N_USER_FOLDER=/app/data/n8n,N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:litellm]
command=litellm --config /app/litellm_config.yaml --port 4000
environment=LITELLM_MASTER_KEY=%(ENV_LITELLM_MASTER_KEY)s,LITELLM_SALT_KEY=%(ENV_LITELLM_SALT_KEY)s,OPENAI_API_KEY=%(ENV_OPENAI_API_KEY)s,ANTHROPIC_API_KEY=%(ENV_ANTHROPIC_API_KEY)s
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:openwebui]
command=open-webui serve --port 8080
environment=OPENAI_API_BASE_URL=http://localhost:4000/v1,OPENAI_API_KEY=%(ENV_LITELLM_MASTER_KEY)s,WEBUI_SECRET_KEY=%(ENV_WEBUI_SECRET_KEY)s,DATA_DIR=/app/data/openwebui
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
