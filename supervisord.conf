[supervisord]
nodaemon=true
user=root

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true

[program:n8n]
command=n8n start
environment=N8N_HOST=0.0.0.0,N8N_PORT=5678,N8N_PROTOCOL=%(ENV_N8N_PROTOCOL)s,WEBHOOK_URL=%(ENV_WEBHOOK_URL)s,GENERIC_TIMEZONE=%(ENV_GENERIC_TIMEZONE)s,N8N_USER_FOLDER=/app/data/n8n
autostart=true
autorestart=true

[program:litellm]
command=litellm --port 4000
environment=LITELLM_MASTER_KEY=%(ENV_LITELLM_MASTER_KEY)s,OPENAI_API_KEY=%(ENV_OPENAI_API_KEY)s,ANTHROPIC_API_KEY=%(ENV_ANTHROPIC_API_KEY)s
autostart=true
autorestart=true

[program:openwebui]
command=open-webui serve --port 8080
environment=OPENAI_API_BASE_URL=http://127.0.0.1:4000/v1,OPENAI_API_KEY=%(ENV_LITELLM_MASTER_KEY)s,WEBUI_SECRET_KEY=%(ENV_WEBUI_SECRET_KEY)s,DATA_DIR=/app/data/openwebui
autostart=true
autorestart=true
