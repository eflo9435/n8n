events {
    worker_connections 1024;
}

http {
    upstream n8n {
        server n8n:5678;
    }
    
    upstream litellm {
        server litellm:4000;
    }
    
    upstream open-webui {
        server open-webui:8080;
    }

    # Default server - Open WebUI (main interface)
    server {
        listen 80 default_server;
        server_name _;
        
        # Increase body size for file uploads
        client_max_body_size 100M;
        
        # Open WebUI - Main chat interface
        location / {
            proxy_pass http://open-webui\;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        # n8n workflows - Access via /n8n
        location /n8n/ {
            proxy_pass http://n8n/\;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for n8n
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        # LiteLLM API - Access via /api
        location /api/ {
            proxy_pass http://litellm/\;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # LiteLLM v1 API endpoint
        location /v1/ {
            proxy_pass http://litellm/v1/\;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
